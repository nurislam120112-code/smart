<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description"
        content="Смарт Кейс — Ош шаарындагы телефондор, аксессуарлар жана телефон оңдоо.">
  <title>Смарт Кейс — Ош</title>

  <style>
    :root {
      --bg: #101010;
      --surface: #1a1a1a;
      --border: #333333;
      --gold: #ffb638;
      --white: #ffffff;
      --muted: #b2b2b2;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 160px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--white);
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    select {
      cursor: pointer;
    }

    button,
    a,
    input,
    select {
      -webkit-tap-highlight-color: transparent;
    }

    :focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 4px;
    }

    [hidden] {
      display: none !important;
    }

    .container {
      width: min(1200px, 92%);
      margin: auto;
    }

    .topbar {
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    .topbar-inner {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 9px 0;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #101010f5;
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand img {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 50%;
      border: 1px solid #705020;
    }

    .brand-name {
      font-size: 23px;
      font-weight: 800;
      line-height: 1.2;
    }

    .brand-name span {
      color: var(--gold);
    }

    .brand-name small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 10px;
      font-weight: normal;
      letter-spacing: 2px;
    }

    nav,
    .languages,
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 44px;
      padding: 11px 19px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      color: var(--white);
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      transition: border-color .2s, background .2s;
    }

    .button:hover {
      border-color: var(--gold);
    }

    .button.primary,
    .button.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #151515;
    }

    .languages .button {
      padding: 9px 13px;
    }

    .hero {
      padding: 80px 0 70px;
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 50px;
      align-items: center;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 20px 0;
      font-size: clamp(36px, 5vw, 64px);
      line-height: 1.15;
      letter-spacing: -1.5px;
    }

    .hero p {
      max-width: 600px;
      color: var(--muted);
      font-size: 18px;
      margin-bottom: 28px;
    }

    .hero-image {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .hero-image img {
      display: block;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid var(--gold);
      box-shadow: 0 0 70px #ffb63818;
    }

    .brand-strip {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
      padding: 22px 15px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
      font-weight: bold;
    }

    section {
      padding: 55px 0;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 34px;
      line-height: 1.25;
    }

    .section-description {
      margin: 0 0 25px;
      color: var(--muted);
    }

    .catalog-controls {
      margin-bottom: 25px;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .filters .button {
      padding: 10px 16px;
    }

    .search-row {
      display: flex;
      gap: 12px;
    }

    input,
    select {
      min-height: 48px;
      padding: 12px 15px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      color: var(--white);
    }

    input {
      width: 100%;
      min-width: 0;
    }

    select {
      min-width: 185px;
    }

    .catalog-count {
      margin: 16px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .product {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 15px;
      transition: border-color .2s;
    }

    .product:hover {
      border-color: #9b712d;
    }

    .product-visual {
      position: relative;
      display: grid;
      place-items: center;
      height: 240px;
      padding: 25px;
      background: #fff;
    }

    .product-visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .image-fallback {
      color: #444;
      font-size: 16px;
      text-align: center;
    }

    .product-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 22px;
    }

    .product-brand {
      margin-bottom: 8px;
      color: var(--gold);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .product h3 {
      margin: 0 0 12px;
      font-size: 21px;
      line-height: 1.35;
    }

    .badges {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .badge {
      padding: 4px 9px;
      border: 1px solid #454545;
      border-radius: 5px;
      color: #ddd;
      font-size: 11px;
    }

    .badge.new {
      color: #a7e7b8;
      border-color: #365640;
      background: #223027;
    }

    .badge.used {
      color: #ffd28b;
      border-color: #65502f;
      background: #30291e;
    }

    .product-note {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .product-price {
      margin: auto 0 18px;
      padding-top: 5px;
      color: var(--gold);
      font-size: 23px;
      font-weight: bold;
      line-height: 1.4;
    }

    .product .button {
      width: 100%;
    }

    .empty {
      padding: 50px 20px;
      text-align: center;
      border: 1px dashed #555;
      border-radius: 14px;
    }

    .empty p {
      color: var(--muted);
    }

    .catalog-disclaimer {
      margin-top: 22px;
      color: var(--muted);
      font-size: 12px;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      margin-top: 25px;
    }

    .service {
      display: flex;
      flex-direction: column;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }

    .service h3 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .service p {
      margin: 0 0 25px;
      color: var(--muted);
    }

    .service .button {
      margin-top: auto;
      align-self: flex-start;
    }

    .contact-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
      padding: 35px;
      border: 1px solid #594426;
      border-radius: 15px;
      background: #1e1b16;
    }

    .contact-box p {
      color: var(--muted);
    }

    .contact-info {
      display: grid;
      gap: 18px;
    }

    .contact-label {
      display: block;
      color: var(--gold);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .contact-box .actions {
      margin-top: 25px;
    }

    footer {
      padding: 28px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 1000px) {
      .header-inner {
        flex-wrap: wrap;
      }

      nav {
        order: 3;
        width: 100%;
      }

      nav .button {
        flex: 1;
      }

      .languages {
        margin-left: auto;
      }

      .hero {
        gap: 25px;
      }

      .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .services-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .topbar {
        font-size: 10px;
      }

      .brand-name {
        font-size: 19px;
      }

      .brand-name small {
        font-size: 8px;
      }

      .brand img {
        width: 48px;
        height: 48px;
      }

      .header-inner {
        gap: 14px;
        padding: 12px 0;
      }

      nav .button {
        padding: 10px 8px;
        font-size: 12px;
      }

      .hero {
        grid-template-columns: 1fr;
        padding: 45px 0;
        gap: 25px;
      }

      .hero h1 {
        font-size: 40px;
      }

      .hero p {
        font-size: 16px;
      }

      .hero-image img {
        max-width: 230px;
      }

      .brand-strip {
        gap: 15px;
        font-size: 12px;
      }

      section {
        padding: 38px 0;
      }

      h2 {
        font-size: 29px;
      }

      .search-row {
        flex-direction: column;
      }

      .filters {
        gap: 6px;
      }

      .filters .button {
        padding: 8px 12px;
        font-size: 12px;
      }

      .products {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .product-visual {
        height: 255px;
      }

      .contact-box {
        grid-template-columns: 1fr;
        padding: 25px;
      }

      .contact-box .actions .button {
        flex: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      * {
        transition: none !important;
      }
    }
  </style>
</head>

        imageUnavailable: "Изображение не загрузилось",
        greeting: "Здравствуйте! Интересует этот телефон: ",
        brandGreeting: "Здравствуйте! Какие новые и б/у модели ",

    let language = "ky";
    let selectedBrand = "all";

    try {
      const savedLanguage = localStorage.getItem("smartcase-language");

      if (savedLanguage === "ky" || savedLanguage === "ru") {
        language = savedLanguage;
      }
    } catch {
      // Сайт localStorage иштебесе да ачылат.
    }

    const searchInput = document.getElementById("search");
    const conditionSelect = document.getElementById("condition");
    const productGrid = document.getElementById("products");
    const emptyState = document.getElementById("empty");
    const countElement = document.getElementById("catalog-count");

    function formatNumber(value) {
      return Number(value).toLocaleString("ru-RU");
    }

    function getPrice(product) {
      const text = translations[language];

      if (product.negotiable) {
        return text.negotiable;
      }

      let result = formatNumber(product.price);

      if (product.maxPrice) {
        result += "–" + formatNumber(product.maxPrice);
      }

      return result + " " + text.currency;
    }

    function getCondition(product) {
      const text = translations[language];

      if (product.condition === "new") return text.new;
      if (product.condition === "used") return text.used;
      if (product.condition === "both") return text.both;

      return text.unknown;
    }

    function getProductTitle(product) {
      return product.model +
        (product.memory ? " · " + product.memory : "");
    }

    function createBadge(label, type) {
      const badge = document.createElement("span");
      badge.className = "badge" + (type ? " " + type : "");
      badge.textContent = label;
      return badge;
    }

    function makeWhatsAppUrl(product) {
      const text = translations[language];
      let message;

      if (product.negotiable) {
        message =
          text.brandGreeting +
          product.brand +
          text.brandQuestion;
      } else {
        message =
          text.greeting +
          getProductTitle(product) +
          ". " +
          getCondition(product) +
          ". " +
          getPrice(product);
      }

      return WHATSAPP + "?text=" + encodeURIComponent(message);
    }

    function createProductCard(product) {
      const text = translations[language];

      const article = document.createElement("article");
      article.className = "product";

      const visual = document.createElement("div");
      visual.className = "product-visual";

      const image = document.createElement("img");
      image.src = product.image;
      image.alt = product.sampleModel || getProductTitle(product);
      image.loading = "lazy";
      image.decoding = "async";
      image.referrerPolicy = "no-referrer";

      const fallback = document.createElement("span");
      fallback.className = "image-fallback";
      fallback.textContent = text.imageUnavailable;
      fallback.hidden = true;

      image.addEventListener("error", () => {
        image.hidden = true;
        fallback.hidden = false;
      }, { once: true });

      visual.append(image, fallback);

      const body = document.createElement("div");
      body.className = "product-body";

      const brand = document.createElement("div");
      brand.className = "product-brand";
      brand.textContent = product.brand;

      const title = document.createElement("h3");
      title.textContent = getProductTitle(product);

      const badges = document.createElement("div");
      badges.className = "badges";

      if (product.condition === "both") {
        badges.append(createBadge(text.both, "new"));
      } else {
        badges.append(
          createBadge(
            getCondition(product),
            product.condition || ""
          )
        );
      }

      const note = document.createElement("p");
      note.className = "product-note";

      if (product.negotiable) {
        note.textContent =
          text.brandDescription +
          " " +
          text.sample +
          " " +
          product.sampleModel +
          ".";
      } else {
        note.textContent = text.availability;
      }

      const price = document.createElement("p");
      price.className = "product-price";
      price.textContent = getPrice(product);

      const button = document.createElement("a");
      button.className = "button primary";
      button.href = makeWhatsAppUrl(product);
      button.target = "_blank";
      button.rel = "noopener";

      button.textContent = product.negotiable
        ? text.askModels
        : text.askProduct;

      body.append(brand, title, badges, note, price, button);
      article.append(visual, body);

      return article;
    }

    function renderProducts() {
      const text = translations[language];
      const query = searchInput.value.trim().toLocaleLowerCase();
      const selectedCondition = conditionSelect.value;

      const visibleProducts = products.filter(product => {
        const matchesBrand =
          selectedBrand === "all" ||
          product.brand === selectedBrand;

        const matchesCondition =
          selectedCondition === "all" ||
          product.condition === selectedCondition ||
          product.condition === "both";

        // Бренд карточкасындагы үлгү моделди
        // өзүнчө сатылып жаткан товар катары издебейбиз.
        const searchableText = [
          product.model,
          product.brand,
          product.memory || ""
        ].join(" ").toLocaleLowerCase();

        const matchesSearch = searchableText.includes(query);

        return matchesBrand && matchesCondition && matchesSearch;
      });

      const fragment = document.createDocumentFragment();

      visibleProducts.forEach(product => {
        fragment.append(createProductCard(product));
      });

      productGrid.replaceChildren(fragment);
      emptyState.hidden = visibleProducts.length > 0;

      countElement.textContent =
        text.count + " " + visibleProducts.length;

      document.querySelectorAll("[data-brand]").forEach(button => {
        const active = button.dataset.brand === selectedBrand;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
    }

    function setLanguage(value) {
      if (!translations[value]) return;

      language = value;
      const text = translations[language];

      document.documentElement.lang = language;
      document.title = "Смарт Кейс — " + text.footer;

      document.querySelectorAll("[data-text]").forEach(element => {
        const key = element.dataset.text;
        element.textContent = text[key] || "";
      });

      document.querySelectorAll("[data-lang]").forEach(button => {
        const active = button.dataset.lang === language;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });

      searchInput.placeholder = text.search;
      searchInput.setAttribute("aria-label", text.search);
      conditionSelect.setAttribute("aria-label", text.conditionLabel);

      try {
        localStorage.setItem("smartcase-language", language);
      } catch {
        // Тилди сактоо мүмкүн болбосо, сайт иштей берет.
      }

      renderProducts();
    }

    document.querySelectorAll("[data-lang]").forEach(button => {
      button.addEventListener("click", () => {
        setLanguage(button.dataset.lang);
      });
    });

    document.querySelectorAll("[data-brand]").forEach(button => {
      button.addEventListener("click", () => {
        selectedBrand = button.dataset.brand;
        renderProducts();
      });
    });

    searchInput.addEventListener("input", renderProducts);
    conditionSelect.addEventListener("change", renderProducts);

    document.getElementById("reset").addEventListener("click", () => {
      selectedBrand = "all";
      searchInput.value = "";
      conditionSelect.value = "all";
      renderProducts();
    });

    setLanguage(language);
  </script>
