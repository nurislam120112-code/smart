
<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<meta name="description" content="Смарт Кейс Ош — телефондор, аксессуарлар жана телефон оңдоо.">
<title>Смарт Кейс — Ош</title>

<style>
:root{
  --bg:#101010;
  --surface:#1a1a1a;
  --border:#333333;
  --gold:#ffb638;
  --white:#ffffff;
  --muted:#b2b2b2;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:140px}
body{
  margin:0;
  background:var(--bg);
  color:var(--white);
  font-family:Arial,sans-serif;
  line-height:1.6;
}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
button,select{cursor:pointer}
[hidden]{display:none!important}
.container{width:min(1200px,92%);margin:auto}
.topbar{
  border-bottom:1px solid var(--border);
  color:var(--muted);
  font-size:12px;
}
.topbar-inner{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:9px 0;
}
header{
  position:sticky;
  top:0;
  z-index:20;
  background:#101010f5;
  border-bottom:1px solid var(--border);
}
.header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:18px;
  padding:14px 0;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand img{
  width:55px;
  height:55px;
  object-fit:cover;
  border-radius:50%;
  border:1px solid #705020;
}
.brand-name{
  font-size:23px;
  font-weight:800;
  line-height:1.2;
}
.brand-name span{color:var(--gold)}
.brand-name small{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:10px;
  font-weight:400;
  letter-spacing:2px;
}
nav,.languages,.actions{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
}
.button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:43px;
  padding:10px 16px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--surface);
  color:white;
  font-size:14px;
  font-weight:700;
  text-align:center;
}
.button:hover{border-color:var(--gold)}
.button.primary,.button.active{
  background:var(--gold);
  border-color:var(--gold);
  color:#151515;
}
.hero{
  display:grid;
  grid-template-columns:1.3fr 1fr;
  align-items:center;
  gap:45px;
  padding:70px 0;
}
.eyebrow{
  color:var(--gold);
  font-size:12px;
  letter-spacing:3px;
}
h1{
  margin:20px 0;
  font-size:clamp(36px,5vw,64px);
  line-height:1.15;
}
.hero p{
  max-width:600px;
  color:var(--muted);
  font-size:18px;
  margin-bottom:28px;
}
.hero-image{
  display:flex;
  align-items:center;
  justify-content:center;
}
.hero-image img{
  width:100%;
  max-width:350px;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:50%;
  border:2px solid var(--gold);
  box-shadow:0 0 70px #ffb63818;
}
.brand-strip{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
  padding:22px 15px;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  color:var(--muted);
  font-size:13px;
  font-weight:bold;
}
section{padding:55px 0}
h2{margin:0 0 12px;font-size:34px}
.section-description{
  margin:0 0 25px;
  color:var(--muted);
}
.filters{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:18px;
}
.filters .button{
  padding:9px 14px;
  font-size:13px;
}
.search-row{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:12px;
}
input,select{
  width:100%;
  min-width:0;
  min-height:48px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--surface);
  color:white;
}
.catalog-count{
  margin:16px 0;
  font-size:13px;
  color:var(--muted);
}
.products{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:22px;
}
.product{
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:15px;
}
.product:hover{border-color:#9b712d}
.product-visual{
  display:grid;
  place-items:center;
  height:235px;
  padding:20px;
  background:#fff;
}
.product-visual img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
}
.product-body{
  display:flex;
  flex-direction:column;
  flex:1;
  padding:20px;
}
.product-brand{
  margin-bottom:7px;
  color:var(--gold);
  font-size:11px;
  font-weight:bold;
  letter-spacing:2px;
}
.product h3{
  margin:0 0 10px;
  font-size:20px;
  line-height:1.35;
}
.badges{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:13px;
}
.badge{
  padding:4px 9px;
  border:1px solid #454545;
  border-radius:5px;
  color:#ddd;
  font-size:11px;
}
.badge.new{
  color:#a7e7b8;
  border-color:#365640;
  background:#223027;
}
.badge.used{
  color:#ffd28b;
  border-color:#65502f;
  background:#30291e;
}
.product-note{
  margin:0 0 16px;
  color:var(--muted);
  font-size:12px;
}
.product-price{
  margin:auto 0 18px;
  padding-top:8px;
  color:var(--gold);
  font-size:22px;
  font-weight:bold;
}
.product .button{width:100%}
.empty{
  padding:50px 20px;
  text-align:center;
  border:1px dashed #555;
  border-radius:14px;
}
.empty p,.catalog-disclaimer{color:var(--muted)}
.catalog-disclaimer{
  margin-top:22px;
  font-size:12px;
}
.services-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
  margin-top:25px;
}
.service{
  display:flex;
  flex-direction:column;
  padding:28px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface);
}
.service h3{
  margin:0 0 12px;
  font-size:22px;
}
.service p{
  margin:0 0 25px;
  color:var(--muted);
}
.service .button{
  margin-top:auto;
  align-self:flex-start;
}
.contact-box{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:35px;
  padding:35px;
  border:1px solid #594426;
  border-radius:15px;
  background:#1e1b16;
}
.contact-box p{color:var(--muted)}
.contact-info{display:grid;gap:18px}
.contact-label{
  display:block;
  margin-bottom:4px;
  color:var(--gold);
  font-size:12px;
}
.contact-box .actions{margin-top:25px}
footer{
  padding:28px 0;
  border-top:1px solid var(--border);
  color:var(--muted);
  text-align:center;
  font-size:13px;
}
@media(max-width:1000px){
  .products{grid-template-columns:repeat(2,1fr)}
  .services-grid{grid-template-columns:1fr}
  nav{order:3;width:100%}
  nav .button{flex:1}
}
@media(max-width:600px){
  .brand-name{font-size:19px}
  .brand img{width:47px;height:47px}
  .header-inner{gap:12px}
  nav .button{font-size:12px;padding:9px 7px}
  .hero{
    grid-template-columns:1fr;
    padding:42px 0;
    gap:25px;
  }
  .hero h1{font-size:39px}
  .hero p{font-size:16px}
  .hero-image img{max-width:230px}
  .brand-strip{gap:13px;font-size:11px}
  section{padding:38px 0}
  h2{font-size:29px}
  .search-row{grid-template-columns:1fr 1fr}
  .search-row input{grid-column:span 2}
  .products{grid-template-columns:1fr}
  .contact-box{
    grid-template-columns:1fr;
    padding:25px;
  }
  .product-visual{height:250px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
}
</style>
</head>

const APPLE_IMAGES =
  "https://cdsassets.apple.com/live/7WUAS350/images/iphone/";

const phones = [];
const uniquePhones = new Set();

function addPhone(brand, model, year, price = null, options = {}) {
  const id = [
    brand,
    model,
    options.memory || "",
    options.condition || ""
  ].join("|");

  if (uniquePhones.has(id)) return;
  uniquePhones.add(id);

  phones.push({
    id,
    brand,
    model,
    year,
    price,
    maxPrice: options.maxPrice || null,
    memory: options.memory || "",
    condition: options.condition || "both",
    image: options.image || ""
  });
}

function addModels(brand, year, models) {
  models.split("|").forEach(model => {
    model = model.trim();
    if (model) addPhone(brand, model, year);
  });
}

// iPhone 17 баалары

  const brands = [

  brands.forEach(brand => {

// Сүрөттөрдүн кэши
const imageCache = new Map();
const pending = new Map();

function normalize(text) {
  return text.toLowerCase()
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

function matchesModel(filename, model) {
  const file = normalize(filename);
  const wanted = normalize(model);

  if (!file.includes(wanted)) return false;

  const after = file.slice(
    file.indexOf(wanted) + wanted.length
  ).trim();

  if (
    !/\b(pro|max|plus|ultra|mini|lite|fe)\b/.test(wanted) &&
    /^(pro|max|plus|ultra|mini|lite|fe)\b/.test(after)
  ) {
    return false;
  }

  return true;
}

function loadImage(url) {
  return new Promise(resolve => {
    if (!url) {
      resolve(false);
      return;
    }

    const img = new Image();

    const timeout = setTimeout(() => {
      img.onload = null;
      img.onerror = null;
      resolve(false);
    }, 10000);

    img.onload = () => {
      clearTimeout(timeout);
      resolve(true);
    };

    img.onerror = () => {
      clearTimeout(timeout);
      resolve(false);
    };

    img.src = url;
  });
}

// Wikimedia Commons аркылуу сүрөт издөө
async function searchPhoto(phone) {
  const key = phone.brand + "|" + phone.model;

  if (imageCache.has(key)) return imageCache.get(key);
  if (pending.has(key)) return pending.get(key);

  const task = (async () => {
    // Алгач Apple сүрөтүн текшеребиз
    if (phone.image && await loadImage(phone.image)) {
      imageCache.set(key, phone.image);
      return phone.image;
    }

    try {
      const params = new URLSearchParams({
        action: "query",
        generator: "search",
        gsrsearch: '"' + phone.model + '" smartphone',
        gsrnamespace: "6",
        gsrlimit: "15",
        prop: "imageinfo",
        iiprop: "url|mime",
        iiurlwidth: "500",
        format: "json",
        origin: "*"
      });

      const url =
        "https://commons.wikimedia.org/w/api.php?" + params;

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("Сүрөт издөө иштеген жок");
      }

      const data = await response.json();
      const pages = Object.values(data.query?.pages || {});

      const candidates = pages.filter(page => {
        const info = page.imageinfo?.[0];
        if (!info) return false;

        const mime = info.mime || "";

        if (!mime.startsWith("image/")) return false;
        if (/svg|gif/i.test(mime)) return false;

        return matchesModel(page.title || "", phone.model);
      });

      for (const page of candidates.slice(0, 5)) {
        const info = page.imageinfo[0];
        const imageUrl = info.thumburl || info.url;

        if (await loadImage(imageUrl)) {
          imageCache.set(key, imageUrl);
          return imageUrl;
        }
      }
    } catch (error) {
      console.warn("Сүрөт табылган жок:", phone.model);
    }

    imageCache.set(key, "");
    return "";
  })();

  pending.set(key, task);

  try {
    return await task;
  } finally {
    pending.delete(key);
  }
}

function getPrice(phone) {
  const t = translations[language];

  if (phone.price === null) return t.negotiable;

  const format = number =>
    Number(number).toLocaleString("ru-RU");

  let result = format(phone.price);

  if (phone.maxPrice) {
    result += "–" + format(phone.maxPrice);
  }

  return result + " " + t.currency;
}

function getTitle(phone) {
  return phone.model +
    (phone.memory ? " · " + phone.memory : "");
}

function getCondition(phone) {
  const t = translations[language];

  if (phone.condition === "new") return t.new;
  if (phone.condition === "used") return t.used;

  return t.both;
}

function makeWhatsAppUrl(phone) {
  const message =
    translations[language].greeting +
    getTitle(phone) +
    ". " + getPrice(phone);

  return WHATSAPP +
    "?text=" + encodeURIComponent(message);
}

// Телефон карточкасын түзүү
function createCard(phone, imageUrl) {
  const t = translations[language];

  const article = document.createElement("article");
  article.className = "product";

  const visual = document.createElement("div");
  visual.className = "product-visual";

  const image = document.createElement("img");
  image.src = imageUrl;
  image.alt = getTitle(phone);
  image.loading = "lazy";
  image.decoding = "async";

  image.addEventListener("error", () => {
    article.remove();
  });

  visual.appendChild(image);

  const body = document.createElement("div");
  body.className = "product-body";

  const brand = document.createElement("div");
  brand.className = "product-brand";
  brand.textContent = phone.brand + " · " + phone.year;

  const title = document.createElement("h3");
  title.textContent = getTitle(phone);

  const badges = document.createElement("div");
  badges.className = "badges";

  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = getCondition(phone);

  if (phone.condition === "new") {
    badge.classList.add("new");
  }

  if (phone.condition === "used") {
    badge.classList.add("used");
  }

  badges.appendChild(badge);

  const note = document.createElement("p");
  note.className = "product-note";
  note.textContent = t.availability;

  const price = document.createElement("p");
  price.className = "product-price";
  price.textContent = getPrice(phone);

  const button = document.createElement("a");
  button.className = "button primary";
  button.href = makeWhatsAppUrl(phone);
  button.target = "_blank";
  button.rel = "noopener";
  button.textContent = t.askProduct;

  body.append(
    brand,
    title,
    badges,
    note,
    price,
    button
  );

  article.append(visual, body);

  return article;
}

// Сүрөттөрдү топ-тобу менен издөө
async function processInBatches(items, callback, size = 5) {
  for (let i = 0; i < items.length; i += size) {
    const batch = items.slice(i, i + size);
    await Promise.all(batch.map(callback));
  }
}

// Каталогду чыгаруу
async function renderProducts() {
  const version = ++renderVersion;
  const t = translations[language];

  const query = searchInput.value.trim().toLowerCase();
  const condition = conditionSelect.value;
  const year = yearSelect.value;

  const filtered = phones.filter(phone => {
    const matchesBrand =
      selectedBrand === "all" ||
      phone.brand === selectedBrand;

    const matchesCondition =
      condition === "all" ||
      phone.condition === condition ||
      phone.condition === "both";

    const matchesYear =
      year === "all" ||
      String(phone.year) === year;

    const searchable = [
      phone.brand,
      phone.model,
      phone.memory,
      phone.year
    ].join(" ").toLowerCase();

    return (
      matchesBrand &&
      matchesCondition &&
      matchesYear &&
      searchable.includes(query)
    );
  });

  productGrid.replaceChildren();
  emptyState.hidden = true;

  countElement.textContent =
    t.loading + " 0/" + filtered.length;

  let checked = 0;
  let found = 0;
  let missing = 0;

  const results = new Array(filtered.length);

  await processInBatches(
    filtered.map((phone, index) => ({ phone, index })),
    async ({ phone, index }) => {
      const url = await searchPhoto(phone);

      if (version !== renderVersion) return;

      results[index] = url;
      checked++;

      if (url) found++;
      else missing++;

      countElement.textContent =
        t.checked + " " + checked + "/" + filtered.length +
        " · " + t.count + " " + found +
        " · " + t.missing + " " + missing;
    },
    5
  );

  if (version !== renderVersion) return;

  const fragment = document.createDocumentFragment();

  filtered.forEach((phone, index) => {
    const imageUrl = results[index];

    // Сүрөтү жок болсо, карточка чыкпайт
    if (!imageUrl) return;

    fragment.appendChild(createCard(phone, imageUrl));
  });

  productGrid.replaceChildren(fragment);
  emptyState.hidden = found > 0;

  countElement.textContent =
    t.count + " " + found +
    " · " + t.missing + " " + missing;

  document.querySelectorAll("[data-brand]").forEach(button => {
    const active =
      button.dataset.brand === selectedBrand;

    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });
}

function setLanguage(lang) {
  if (!translations[lang]) return;

  language = lang;
  const t = translations[lang];

  document.documentElement.lang = lang;

  document.querySelectorAll("[data-text]").forEach(el => {
    el.textContent = t[el.dataset.text] || "";
  });

  document.querySelectorAll("[data-lang]").forEach(button => {
    const active = button.dataset.lang === lang;

    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });

  searchInput.placeholder = t.search;
  searchInput.setAttribute("aria-label", t.search);

  buildBrandFilters();

  try {
    localStorage.setItem("smartcase-language", lang);
  } catch (error) {}

  renderProducts();
}

document.querySelectorAll("[data-lang]").forEach(button => {
  button.addEventListener("click", () => {
    setLanguage(button.dataset.lang);
  });
});

searchInput.addEventListener("input", renderProducts);
conditionSelect.addEventListener("change", renderProducts);
yearSelect.addEventListener("change", renderProducts);

document.getElementById("reset").addEventListener("click", () => {
  selectedBrand = "all";
  searchInput.value = "";
  conditionSelect.value = "all";
  yearSelect.value = "all";
  renderProducts();
});

setLanguage(language);
